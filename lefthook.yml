# Git-Hooks (https://lefthook.dev). Installiert über `npm ci`/`npm install` (prepare → scripts/lefthook-install.mjs).
#
#   npx lefthook run pre-commit       Hooks von Hand ausführen
#   npx lefthook run pre-push
#   LEFTHOOK=0 git commit …           im Notfall überspringen (git commit/push --no-verify geht auch)

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: bash scripts/gitleaks.sh --staged

    - name: eslint
      glob: "*.{ts,html,mjs,js}"
      # Von ESLint ignorierte Dateien (dist/, .claude/worktrees/ …) ohne Warnung überspringen
      run: npx --no -- eslint --no-warn-ignored {staged_files}

    # Workflows, Composite-Action und Dependabot: actionlint und zizmor
    - name: actions-lint
      glob: ".github/**/*.{yml,yaml}"
      run: bash scripts/actions-lint.sh

pre-push:
  piped: true
  jobs:
    # Typecheck inkl. Templates (strictTemplates): ngc für App und Unit-Tests, tsc für E2E
    - name: typecheck
      run: npm run --silent typecheck

    - name: unit-tests
      run: npx --no -- ng test --watch=false

    # Ungenutzter Code und Architekturregeln (wie die CI-Jobs "Knip" und "Architektur")
    - name: knip
      run: npm run --silent knip

    - name: architektur
      run: npm run --silent depcruise
