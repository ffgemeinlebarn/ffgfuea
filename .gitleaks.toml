# gitleaks configuration (https://github.com/gitleaks/gitleaks)
# Used by scripts/gitleaks.sh (npm run secrets:scan) and .github/workflows/secrets.yml.

title = "ffgfuea"

# Keep all built-in rules of the pinned gitleaks version.
[extend]
useDefault = true

# Directories that are git-ignored, generated or third-party. They never end up in a
# commit, but `gitleaks dir` (working tree scan) would otherwise walk them.
[[allowlists]]
description = "Ignored, generated and third-party directories"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.angular/''',
  '''(^|/)reports/''',
  '''(^|/)coverage/''',
  '''(^|/)\.lighthouseci/''',
]
