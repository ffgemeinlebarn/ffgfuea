version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    # Let new releases settle for a few days before proposing them (supply-chain safety).
    # Security updates are not delayed.
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 5
    labels: [ dependencies, javascript ]
    ignore:
      # Angular gibt den TypeScript-Bereich vor (z. B. ">=6.0 <6.1"), neue Minor/Major nur zusammen mit Angular.
      - dependency-name: typescript
        update-types: [ "version-update:semver-minor", "version-update:semver-major" ]
      # Angular-Majors über "ng update" (Migrationen), nicht über Dependabot.
      - dependency-name: "@angular/*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "@angular-devkit/*"
        update-types: [ "version-update:semver-major" ]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    groups:
      # Angular packages must be updated together (ng update for majors).
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      dev-dependencies:
        dependency-type: development
        update-types: [ minor, patch ]
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    labels: [ dependencies, github-actions ]
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: [ "*" ]
