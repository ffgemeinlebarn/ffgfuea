name: Build & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Vor dem Upload ALLE Dateien am Server löschen (z. B. beim ersten Deploy, um alte Builds zu entfernen)'
        type: boolean
        default: false

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: FFGFUEA
          path: dist/ffgfuea/browser/
          include-hidden-files: true

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: [ build ]
    # Nur Release-Tags (v*) oder manuell gestartet von main bzw. einem Tag
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: production

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: FFGFUEA
          path: deploy

      # Lädt nur geänderte Dateien hoch und entfernt veraltete; der Stand liegt in .ftp-deploy-sync-state.json am Server
      - name: Deploy in Stage 'Production' via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_DEPLOY_HOST }}
          username: ${{ secrets.FTP_DEPLOY_USERNAME }}
          password: ${{ secrets.FTP_DEPLOY_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: ${{ github.event.inputs.clean_slate == 'true' }}
