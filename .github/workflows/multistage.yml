name: Build & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Vor dem Upload ALLE Dateien am Server löschen (z. B. beim ersten Deploy, um alte Builds zu entfernen)'
        type: boolean
        default: false

permissions: {}

# Neuere Pushes auf einen Pull Request brechen ältere Läufe ab. Alle anderen Läufe
# (Pushes, Tags, manueller Deploy) bekommen eine eigene Gruppe und laufen immer durch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check licenses
        run: npm run check:licenses

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FFGFUEA
          path: dist/ffgfuea/browser/
          include-hidden-files: true

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    needs: [ build ]
    # Nur Release-Tags (v*) oder manuell gestartet von main bzw. einem Tag
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: production
    permissions:
      contents: read

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FFGFUEA
          path: deploy

      # Lädt nur geänderte Dateien hoch und entfernt veraltete; der Stand liegt in .ftp-deploy-sync-state.json am Server
      - name: Deploy in Stage 'Production' via FTP
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_DEPLOY_HOST }}
          username: ${{ secrets.FTP_DEPLOY_USERNAME }}
          password: ${{ secrets.FTP_DEPLOY_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: ${{ github.event.inputs.clean_slate == 'true' }}
