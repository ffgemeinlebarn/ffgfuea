name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev): bewertet Supply-Chain-Praktiken des Repos.
# Ergebnisse: Security → Code scanning, öffentlich unter
# https://scorecard.dev/viewer/?uri=github.com/ffgemeinlebarn/ffgfuea (Badge in der README).
# Achtung: publish_results erlaubt keine top-level env/defaults und nur bestimmte Actions
# in diesem Job – Änderungen hier knapp halten.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '17 5 * * 1'
  # Läuft neu, wenn Branch-Protection-Regeln geändert werden
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload der SARIF-Ergebnisse nach Code scanning
      security-events: write
      # Veröffentlichung der Ergebnisse und des Badges (OIDC)
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
