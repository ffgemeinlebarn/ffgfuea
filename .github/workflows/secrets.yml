name: Secrets

on:
  push:
    branches: [ '**' ]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned gitleaks release, checksum-verified by the script (no gitleaks-action:
      # it needs a paid license for organizations). Findings are printed redacted.
      - name: Scan git history
        run: bash scripts/gitleaks.sh --history
