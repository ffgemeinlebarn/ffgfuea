name: Mutation

# Mutation-Testing der Fachlogik mit StrykerJS (Konfiguration: stryker.config.mjs).
# Optional: läuft wöchentlich und manuell, blockiert keine PRs. Ergebnis als Tabelle in der
# Job-Zusammenfassung, vollständiger HTML-Bericht als Artefakt "mutation-report".
# Inkrementell: Die Ergebnisse des letzten Laufs liegen im Actions-Cache, geprüft werden nur
# Mutanten in geändertem Code oder mit geänderten Tests.

on:
  schedule:
    # Montag 05:47 UTC
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Schlüssel je Lauf, damit der Cache nach jedem Lauf aktualisiert wird; geladen wird der jüngste
      - name: Incremental-Stand laden
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - name: Mutation-Testing
        run: npx stryker run

      - name: Zusammenfassung
        if: ${{ !cancelled() }}
        run: node scripts/mutation-summary.mjs

      - name: Upload Bericht
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
