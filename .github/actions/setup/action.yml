name: Node & Abhängigkeiten
description: Node.js 24 mit npm-Cache einrichten und Abhängigkeiten installieren (Checkout vorher im Job)

runs:
  using: composite
  steps:
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Install Dependencies
      shell: bash
      run: npm ci
