<div class="left">
    <h3>{{ fuellung().flasche.feuerwehr?.name }} - Nr. {{ fuellung().flasche.karteiNr }}</h3>
    <p>
        <span>{{ fuellung().flasche.typenBezeichnung }}</span>
        <span> | </span>
        <span>Barcode: {{ fuellung().flasche.barcode }}</span>
        @if (manuell()) {
            <span> | </span>
            <span class="manuell" title="Flasche wurde in der Verwaltung manuell erfasst">manuell erfasst</span>
        }
    </p>
</div>
<mat-chip-set>
    <mat-chip>{{ fuellung().datetime | date: 'HH:mm:ss' }} Uhr</mat-chip>
</mat-chip-set>
